<main id="contact">
  <div class="section">
    <h2>Schreiben Sie uns</h2>
    <form id="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="form-group">
        <label>Name *</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="formData.name"
          placeholder="Ihr Name" 
          required>
      </div>

      <div class="form-group">
        <label>E-Mail *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="formData.email"
          placeholder="Ihre E-Mail-Adresse" 
          required>
      </div>

      <div class="form-group">
        <label>Nachricht *</label>
        <textarea 
          id="message" 
          name="message" 
          [(ngModel)]="formData.message"
          placeholder="Ihre Nachricht an uns" 
          rows="4" 
          required></textarea>
      </div>

      <button type="submit" [disabled]="!contactForm.form.valid">
        Nachricht senden
      </button>
    </form>
  </div>
</main>
